version: "3.8"

services:
  # ── Java Mock API Server (Spring Boot) ─────────────────────────────────────
  mock-server-java:
    build:
      context: ./java
      dockerfile: Dockerfile
    container_name: mock-server-java
    ports:
      - "8080:8080"    # Plain HTTP / WS
      - "8442:8442"    # HTTPS / WSS, TLS 1.2 only
      - "8443:8443"    # HTTPS / WSS, TLS 1.3 only (primary)
      - "8444:8444"    # HTTPS / WSS, TLS 1.2 + 1.3 (combined)
    restart: unless-stopped

  # ── Python Mock API Server (Flask) ─────────────────────────────────────────
  mock-server-python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: mock-server-python
    ports:
      - "9080:8080"    # Plain HTTP / WS
      - "9442:8442"    # HTTPS / WSS, TLS 1.2 only
      - "9443:8443"    # HTTPS / WSS, TLS 1.3 only
      - "9444:8444"    # HTTPS / WSS, TLS 1.2 + 1.3
    environment:
      - MOCK_SSL_ENABLED=true
      - MOCK_HTTP_PORT=8080
      - MOCK_TLS12_PORT=8442
      - MOCK_TLS13_PORT=8443
      - MOCK_TLS12_13_PORT=8444
    restart: unless-stopped

  # ── Go Mock API Server ─────────────────────────────────────────────────────
  mock-server-go:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: mock-server-go
    ports:
      - "10080:8080"    # Plain HTTP / WS
      - "18442:8442"    # HTTPS / WSS, TLS 1.2 only
      - "18443:8443"    # HTTPS / WSS, TLS 1.3 only
      - "18444:8444"    # HTTPS / WSS, TLS 1.2 + 1.3
    environment:
      - MOCK_SSL_ENABLED=true
      - MOCK_HTTP_PORT=8080
      - MOCK_TLS12_PORT=8442
      - MOCK_TLS13_PORT=8443
      - MOCK_TLS12_13_PORT=8444
      - MOCK_STATIC_DIR=static
      - MOCK_CERT_DIR=certs
    restart: unless-stopped

  # ── Node.js Mock API Server (Express) ──────────────────────────────────────
  mock-server-node:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    container_name: mock-server-node
    ports:
      - "11080:8080"    # Plain HTTP / WS
      - "19442:8442"    # HTTPS / WSS, TLS 1.2 only
      - "19443:8443"    # HTTPS / WSS, TLS 1.3 only
      - "19444:8444"    # HTTPS / WSS, TLS 1.2 + 1.3
    environment:
      - MOCK_SSL_ENABLED=true
      - MOCK_HTTP_PORT=8080
      - MOCK_TLS12_PORT=8442
      - MOCK_TLS13_PORT=8443
      - MOCK_TLS12_13_PORT=8444
      - MOCK_STATIC_DIR=static
      - MOCK_CERT_DIR=certs
    restart: unless-stopped
