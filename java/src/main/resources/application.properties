# ─── Server ───────────────────────────────────────────────────────────────────
# Primary connector: HTTPS/WSS on 8443 (when SSL enabled)
server.port=8443

# ─── SSL / WSS (HTTPS + WSS on port 8443) ────────────────────────────────────
# Comment out the block below to disable TLS (WSS). A self-signed keystore is
# generated at startup if it doesn't already exist (see KeystoreInitializer).
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=mock-server
# Primary connector restricted to TLS 1.3 only (port 8443)
server.ssl.enabled-protocols=TLSv1.3
server.ssl.protocol=TLSv1.3

# ─── Multi-TLS connector ports ────────────────────────────────────────────────
# TomcatConfig reads these to register additional per-version HTTPS connectors.
#
#  8080  — plain HTTP / WS            (no TLS)
#  8442  — HTTPS / WSS, TLS 1.2 only
#  8443  — HTTPS / WSS, TLS 1.3 only  (Spring Boot primary connector)
#  8444  — HTTPS / WSS, TLS 1.2 + 1.3 (browser-friendly combined)
mock.server.http-port=8080
mock.server.tls12-port=8442
mock.server.tls12-13-port=8444

# ─── Spring Security (open everything for demo purposes) ─────────────────────
# Override in production!
spring.security.user.name=admin
spring.security.user.password=admin123

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.indent-output=true

# ─── GraphQL ──────────────────────────────────────────────────────────────────
# HTTP endpoint  : POST http://localhost:8080/graphql
# GraphiQL IDE   : http://localhost:8080/graphiql
# WS subscription: ws://localhost:8080/graphql-ws  (plain)
#                  wss://localhost:8443/graphql-ws  (TLS)
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.websocket.path=/graphql-ws
spring.graphql.schema.printer.enabled=true
